<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MuteMe</title>
  <desc id="desc">Step away, mute on. Come back, mic on. A lightweight Windows microphone tray app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1529"/><stop offset="1" stop-color="#192742"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1145" cy="26" r="215" fill="#2dd4bf" opacity=".035"/>
  <circle cx="960" cy="330" r="150" fill="#818cf8" opacity=".045"/>
  <g stroke="#7e93b6" stroke-width="1" opacity=".09"><path d="M760 0v360M840 0v360M920 0v360M1000 0v360M1080 0v360M1160 0v360M720 60h480M720 140h480M720 220h480M720 300h480"/></g>
  <rect x="64" y="52" width="108" height="108" rx="30" fill="url(#accent)"/>
  <g fill="none" stroke="#102337" stroke-width="7" stroke-linecap="round"><rect x="106" y="74" width="24" height="44" rx="12"/><path d="M94 108v3a24 24 0 0 0 48 0v-3M118 135v10M105 145h26"/></g>
  <text x="197" y="132" fill="#f4f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="74" font-weight="700" letter-spacing="-3">Mute<tspan fill="#6ee7b7">Me</tspan></text>
  <text x="67" y="211" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">Step away, mute on. Come back, mic on.</text>
  <text x="67" y="249" fill="#94a8c7" font-family="Segoe UI,Arial,sans-serif" font-size="19">Your microphone. One quiet little Windows tray app.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="66" y="287" width="110" height="28" rx="14" fill="#26354e"/><text x="82" y="306" fill="#bfcde3">MOUSE AWARE</text>
    <rect x="187" y="287" width="116" height="28" rx="14" fill="#26354e"/><text x="204" y="306" fill="#bfcde3">NO RECORDING</text>
    <rect x="314" y="287" width="102" height="28" rx="14" fill="#26354e"/><text x="331" y="306" fill="#bfcde3">STAYS LOCAL</text>
  </g>
  <rect x="823" y="76" width="301" height="200" rx="22" fill="#101d32" stroke="#324663"/>
  <circle cx="852" cy="103" r="4" fill="#64748b"/><circle cx="867" cy="103" r="4" fill="#64748b"/><circle cx="882" cy="103" r="4" fill="#64748b"/>
  <g stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"><path d="M855 173v6M872 160v32M889 147v58M906 162v28M923 168v17"/></g>
  <path d="M941 177h22" stroke="#536b8b" stroke-width="2"/><path d="M957 172l6 5-6 5" fill="none" stroke="#536b8b" stroke-width="2"/>
  <g stroke="#fbbf24" stroke-width="5" stroke-linecap="round"><path d="M983 177h7M1000 177h7M1017 177h7M1034 177h7M1051 177h7M1068 177h7M1085 177h7"/></g>
  <text x="854" y="240" fill="#6ee7b7" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">ACTIVE</text>
  <text x="1002" y="240" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">60s → MUTED</text>
</svg>
